<div id="tooltip"></div>
<script>
let scale = 1;
const wrap = document.getElementById('wrap');
const tree = document.getElementById('tree');

function zoom(factor) {
  scale = Math.max(0.15, Math.min(scale * factor, 4));
  tree.style.transform = `scale(${scale})`;
}
function resetView() {
  scale = 1; tree.style.transform = '';
  wrap.scrollTop = 0; wrap.scrollLeft = 0;
}
function goToRoot() {
  scale = 0.7; tree.style.transform = `scale(${scale})`;
  wrap.scrollTop = 0; wrap.scrollLeft = 0;
}

// Drag to pan
let drag = false, sx, sy, sl, st;
wrap.addEventListener('mousedown', e => { drag=true; sx=e.pageX; sy=e.pageY; sl=wrap.scrollLeft; st=wrap.scrollTop; });
document.addEventListener('mouseup', () => drag=false);
wrap.addEventListener('mousemove', e => {
  if(!drag) return; e.preventDefault();
  wrap.scrollLeft = sl - (e.pageX - sx);
  wrap.scrollTop  = st - (e.pageY - sy);
});
wrap.addEventListener('wheel', e => {
  if(e.ctrlKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9); }
}, {passive:false});

// Scroll to root on load
window.addEventListener('load', () => {
  wrap.scrollLeft = Math.max(0, 2255 * 0.7 - wrap.clientWidth/2);
});
</script>
